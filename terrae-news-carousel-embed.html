<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @font-face { font-family:'AutautGrotesk'; font-weight:400; src:url('https://radicierranti.github.io/terrae-assets/AutautGrotesk-Regular.otf') format('opentype'); }
  @font-face { font-family:'AutautGrotesk'; font-weight:500; src:url('https://radicierranti.github.io/terrae-assets/AutautGrotesk-Medium.otf') format('opentype'); }
  @font-face { font-family:'AutautGrotesk'; font-weight:600; src:url('https://radicierranti.github.io/terrae-assets/AutautGrotesk-Semibold.otf') format('opentype'); }
  @font-face { font-family:'AutautGrotesk'; font-weight:700; src:url('https://radicierranti.github.io/terrae-assets/AutautGrotesk-Bold.otf') format('opentype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    background: transparent;
    overflow-x: hidden;
    overflow-y: hidden;
    font-family: 'AutautGrotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --ink: #0a0a0a;
    --muted: #6b6b66;
    --gap: 20px;
    --radius: 4px;
    --dur: 480ms;
  }

  .wrap { width: 100%; }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    background: var(--ink);
    color: #fff;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 0;
    font-family: 'AutautGrotesk', system-ui, sans-serif;
  }

  .nav-arrows { display: flex; gap: 8px; }

  .arrow {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--ink);
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink);
    transition: background var(--dur), color var(--dur), opacity var(--dur);
  }
  .arrow:hover { background: var(--ink); color: #fff; }
  .arrow:disabled { opacity: 0.25; }
  .arrow svg { width: 14px; height: 14px; }

  .rule { height: 1px; background: var(--ink); margin-bottom: 24px; }

  .viewport { overflow: hidden; width: 100%; }

  .track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: calc((100% - 3 * var(--gap)) / 3.8);
    gap: var(--gap);
    transition: transform var(--dur) cubic-bezier(.5,.05,.2,1);
    will-change: transform;
  }

  .card { display: flex; flex-direction: column; gap: 10px; cursor: pointer; }
  .card:hover .title { text-decoration: underline; }

  .thumb {
    width: 100%;
    aspect-ratio: 325/200;
    background: #ddd;
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .thumb img, .thumb svg {
    display: block; width: 100%; height: 100%;
    object-fit: cover; transition: opacity 0.2s;
  }
  .card:hover .thumb img { opacity: 0.88; }

  .date-badge {
    position: absolute; top: 8px; left: 8px;
    background: var(--ink); color: #fff;
    font: 500 11px/1 'AutautGrotesk', sans-serif;
    padding: 6px 10px; border-radius: 2px;
    letter-spacing: 0.04em;
  }

  .kicker {
    font: 500 10px/1 'AutautGrotesk', sans-serif;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .title {
    font-size: 16px; line-height: 1.25; font-weight: 600;
    color: var(--ink);
  }

  .excerpt {
    font-size: 14px; line-height: 1.35; font-weight: 400;
    color: var(--ink); margin-top: 4px;
  }

  .loading {
    text-align: center; padding: 40px 0;
    font: 500 12px/1 'AutautGrotesk', monospace;
    color: var(--muted);
  }

  /* --- MOBILE --- */
  @media (max-width: 600px) {
    .nav-arrows { display: none; }

    .track {
      grid-auto-flow: row;
      grid-auto-columns: unset;
      display: flex;
      flex-direction: column;
      transform: none !important;
      transition: none;
      gap: 0;
    }

    .card {
      flex-direction: row;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(10,10,10,0.1);
    }
    .card:first-child { border-top: 1px solid rgba(10,10,10,0.1); }

    .thumb {
      width: 90px;
      min-width: 90px;
      aspect-ratio: 1/1;
      flex-shrink: 0;
    }

    .card-text {
      display: flex; flex-direction: column;
      gap: 5px; flex: 1; min-width: 0;
    }

    .excerpt { display: none; }
    .date-badge { font-size: 10px; padding: 4px 8px; }
    .title { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="wrap" id="terrae-carousel-root">
  <div class="section-head">
    <span class="pill">NEWS</span>
    <div class="nav-arrows">
      <button class="arrow" id="terrae-prev" type="button" aria-label="Precedente" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="arrow" id="terrae-next" type="button" aria-label="Successivo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>
  <div class="rule"></div>
  <div class="viewport">
    <div class="track" id="terrae-track">
      <div class="loading">Caricamento…</div>
    </div>
  </div>
</div>

<script>
(function() {

  var SHEET_ID   = '16gaKN5vvNRYcnutzrDTiOWLOYyyufm6KlvQC5VCwL2I';
  var SHEET_URL  = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&sheet=News';
  var DETAIL_URL = 'https://terraefilmfest.xyz/news';
  var HUES       = [18,130,28,210,280,60,160,340];
  var PATTERNS   = ['diag','grid','dots'];

  var NEWS = [];
  var INDEX = 0;
  var AUTOPLAY = null;
  var mqMobile = window.matchMedia('(max-width:600px)');

  function placeholderSVG(hue, pat) {
    var bg='oklch(0.78 0.06 '+hue+')', fg='oklch(0.55 0.08 '+hue+')';
    var p='';
    if (pat==='diag') p='<pattern id="p" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="'+bg+'"/><line x1="0" y1="0" x2="0" y2="14" stroke="'+fg+'" stroke-width="6"/></pattern>';
    else if (pat==='grid') p='<pattern id="p" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="'+bg+'"/><path d="M20 0H0v20" stroke="'+fg+'" stroke-width="1" fill="none"/></pattern>';
    else p='<pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="'+bg+'"/><circle cx="8" cy="8" r="2.2" fill="'+fg+'"/></pattern>';
    return '<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>'+p+'</defs><rect width="400" height="300" fill="url(#p)"/></svg>';
  }

  function parseCSV(csv) {
    var rows=[], row=[], cur='', inQ=false;
    for (var i=0; i<csv.length; i++) {
      var c=csv[i];
      if (inQ) {
        if (c==='"'&&csv[i+1]==='"'){cur+='"';i++;}
        else if (c==='"'){inQ=false;}
        else{cur+=c;}
      } else {
        if (c==='"'){inQ=true;}
        else if (c===','){row.push(cur);cur='';}
        else if (c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if (c==='\r'){}
        else{cur+=c;}
      }
    }
    if (cur||row.length){row.push(cur);rows.push(row);}
    return rows;
  }

  function csvToNews(csv) {
    return parseCSV(csv).slice(1).map(function(cols,i) {
      var titolo=(cols[0]||'').trim();
      var data=(cols[1]||'').trim();
      var estratto=(cols[2]||'').trim();
      var immagine=(cols[3]||'').trim();
      var tag=((cols[4]||'NEWS').trim()).toUpperCase();
      var pubblicato=(cols[6]||'').trim().toLowerCase();
      if (pubblicato!=='si'||!titolo) return null;
      return {id:i,titolo:titolo,data:data,estratto:estratto,immagine:immagine,tag:tag,hue:HUES[i%HUES.length],pattern:PATTERNS[i%PATTERNS.length]};
    }).filter(Boolean);
  }

  function stripHTML(str) {
    var tmp=document.createElement('div');
    tmp.innerHTML=str;
    return tmp.textContent||tmp.innerText||'';
  }

  function goToDetail(id) {
    try { localStorage.setItem('terrae-news-id', String(id)); } catch(e) {}
    try { window.top.location.href=DETAIL_URL; } catch(e) { window.location.href=DETAIL_URL; }
  }

  function notifyHeight() {
    var h = document.getElementById('terrae-carousel-root').offsetHeight;
    try { window.parent.postMessage({ type: 'terrae-height', height: h }, '*'); } catch(e) {}
  }

  function cardW() {
    var f = document.querySelector('.card');
    return f ? f.offsetWidth : 325;
  }

  function visibleCount() {
    var vp = document.querySelector('.viewport');
    if (!vp) return 3;
    return Math.max(1, Math.floor((vp.offsetWidth + 20) / (cardW() + 20)));
  }

  function update() {
    var track = document.getElementById('terrae-track');
    var prev  = document.getElementById('terrae-prev');
    var next  = document.getElementById('terrae-next');
    if (!track||!prev||!next) return;
    var v=visibleCount(), max=Math.max(0,NEWS.length-v);
    if (INDEX>max) INDEX=max;
    if (INDEX<0) INDEX=0;
    track.style.transform='translateX('+(-INDEX*(cardW()+20))+'px)';
    prev.disabled=INDEX<=0;
    next.disabled=INDEX>=max;
  }

  function stopAutoplay() {
    if (AUTOPLAY){clearInterval(AUTOPLAY);AUTOPLAY=null;}
  }

  function startAutoplay() {
    stopAutoplay();
    if (!mqMobile.matches) return;
    AUTOPLAY=setInterval(function(){
      var v=visibleCount(), max=Math.max(0,NEWS.length-v);
      INDEX=INDEX>=max?0:INDEX+1;
      update();
    },3500);
  }

  function renderCards() {
    var track=document.getElementById('terrae-track');
    if (!track) return;
    track.innerHTML='';
    if (!NEWS.length){track.innerHTML='<div class="loading">Nessuna news pubblicata.</div>';notifyHeight();return;}
    NEWS.forEach(function(n,idx){
      var el=document.createElement('article');
      el.className='card';
      el.setAttribute('role','button');
      el.setAttribute('tabindex','0');
      el.addEventListener('click',function(){goToDetail(idx);});
      el.addEventListener('keydown',function(e){if(e.key==='Enter')goToDetail(idx);});
      var thumb=n.immagine
        ?'<img src="'+n.immagine+'" alt="'+stripHTML(n.titolo)+'" loading="lazy" onload="notifyHeight()">'
        :placeholderSVG(n.hue,n.pattern);
      el.innerHTML=
        '<div class="thumb">'+thumb+(n.data?'<span class="date-badge">'+stripHTML(n.data)+'</span>':'')+'</div>'+
        '<div class="card-text">'+
          '<div class="kicker">'+stripHTML(n.tag)+'</div>'+
          '<div class="title">'+stripHTML(n.titolo)+'</div>'+
          (n.estratto?'<div class="excerpt">'+stripHTML(n.estratto)+'</div>':'')+
        '</div>';
      track.appendChild(el);
    });
    setTimeout(notifyHeight, 100);
  }

  async function init() {
    try {
      var ctrl=new AbortController();
      var t=setTimeout(function(){ctrl.abort();},8000);
      var res=await fetch(SHEET_URL+'&t='+Date.now(),{cache:'no-store',signal:ctrl.signal});
      clearTimeout(t);
      if (!res.ok) throw new Error('HTTP '+res.status);
      var csv=await res.text();
      NEWS=csvToNews(csv);
      if (!NEWS.length) throw new Error('Nessuna news pubblicata');
    } catch(e) {
      var tr=document.getElementById('terrae-track');
      if (tr) tr.innerHTML='<div class="loading">Errore: '+(e.name==='AbortError'?'Timeout':e.message)+'</div>';
      notifyHeight();
      return;
    }
    renderCards();
    INDEX=0;
    update();
    startAutoplay();
  }

  document.getElementById('terrae-prev').addEventListener('click',function(e){
    e.stopPropagation();stopAutoplay();INDEX--;update();
  });
  document.getElementById('terrae-next').addEventListener('click',function(e){
    e.stopPropagation();stopAutoplay();INDEX++;update();
  });
  document.querySelector('.viewport').addEventListener('touchstart',stopAutoplay,{passive:true});

  var rt;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){INDEX=0;update();startAutoplay();notifyHeight();},120);
  });
  if (mqMobile.addEventListener) mqMobile.addEventListener('change',startAutoplay);

  // Esponi notifyHeight globalmente per i callback onload delle img
  window.notifyHeight = notifyHeight;

  init();

})();
</script>
</body>
</html>
