name: Aggiorna feed Substack

on:
  schedule:
    - cron: '0 * * * *'   # ogni ora
  workflow_dispatch:        # eseguibile manualmente

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica feed Substack, filtra tag "news" e salva JSON
        run: |
          curl -s "https://terraefilmfest.substack.com/api/v1/posts?limit=50&offset=0" \
            -H "Accept: application/json" \
            | python3 -c "
import json, sys
posts = json.load(sys.stdin)
filtered = [p for p in posts if any(
    t.get('name','').lower() == 'news'
    for t in (p.get('postTags') or [])
)]
print(json.dumps(filtered, ensure_ascii=False, indent=2))
" > substack-feed.json

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add substack-feed.json
          git diff --cached --quiet || git commit -m "chore: aggiorna feed Substack"
          git push
