name: Aggiorna feed Substack

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Scarica feed RSS Substack
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0" \
            "https://terraefilmfest.substack.com/feed" \
            -o substack-feed.json

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add substack-feed.json
          git diff --cached --quiet || git commit -m "chore: aggiorna feed Substack"
          git push
